<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sandbox payment</title>
  <style>
    body { font-family: system-ui, sans-serif; background:#f4f4f5; display:grid; place-items:center; min-height:100vh; margin:0; }
    .card { background:#fff; padding:2rem; border-radius:12px; max-width:380px; box-shadow:0 4px 24px #0001; }
    .tag { background:#fde68a; padding:2px 8px; border-radius:6px; font-size:.75rem; font-weight:600; }
    button { width:100%; padding:.8rem; border:0; border-radius:8px; font-size:1rem; cursor:pointer; margin-top:.6rem; }
    .pay { background:#16a34a; color:#fff; } .fail { background:#e5e7eb; }
  </style>
</head>
<body>
  <form class="card" method="post">
    {% csrf_token %}
    <span class="tag">SANDBOX — no real money</span>
    <h2>Pay {{ payment.amount }} LKR</h2>
    <p>Order {{ payment.order.reference }}<br>Method: {{ payment.method }}</p>
    <button class="pay" name="action" value="pay">Simulate successful payment</button>
    <button class="fail" name="action" value="fail">Simulate failed / cancelled</button>
  </form>
</body>
</html>
